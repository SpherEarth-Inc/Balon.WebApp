name: Deploy to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dreamhost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Clean install so every build reflects current code (no stale cache)
      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://football.spherearth.ca' }}
          NEXT_PUBLIC_CALENDLY_URL: ${{ vars.NEXT_PUBLIC_CALENDLY_URL || '' }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '' }}
          NEXT_PUBLIC_DOMAIN_API_URL: ${{ vars.NEXT_PUBLIC_DOMAIN_API_URL || 'https://balon-domain-api.spherearth.ca' }}
          NEXT_PUBLIC_APP_LOGIN_URL: ${{ vars.NEXT_PUBLIC_APP_LOGIN_URL || 'https://balon.spherearth.ca' }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID || '' }}
          NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.NEXT_PUBLIC_LINKEDIN_PARTNER_ID || '' }}
          NEXT_PUBLIC_LINKEDIN_ADVISOR_CONVERSION_ID: ${{ vars.NEXT_PUBLIC_LINKEDIN_ADVISOR_CONVERSION_ID || '' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID || '' }}
          NEXT_PUBLIC_TWITTER_PIXEL_ID: ${{ vars.NEXT_PUBLIC_TWITTER_PIXEL_ID || '' }}
          NEXT_PUBLIC_TWITTER_ADVISOR_EVENT_ID: ${{ vars.NEXT_PUBLIC_TWITTER_ADVISOR_EVENT_ID || '' }}

      # DreamHost uses SFTP (port 22), not plain FTP (port 21).
      # Rockae uses FTP on Hostinger; those credentials/protocol do not transfer here.
      # lftp mirror --delete syncs out/ like FTP-Deploy-Action: upload changes + remove stale files.
      # GitHub secrets — Settings → Secrets and variables → Actions:
      #   DREAMHOST_SFTP_SERVER      → hostname only (no sftp:// prefix)
      #   DREAMHOST_SFTP_USERNAME    → DreamHost SFTP user
      #   DREAMHOST_SFTP_PASSWORD    → DreamHost SFTP password
      #   DREAMHOST_SFTP_FOLDER_NAME → domain folder only (not a full path)
      #                                e.g. football.spherearth.ca
      #                                Deploys to /home/<username>/<folder>/
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync site to DreamHost via SFTP
        env:
          SFTP_SERVER: ${{ secrets.DREAMHOST_SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.DREAMHOST_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
          SFTP_FOLDER_NAME: ${{ secrets.DREAMHOST_SFTP_FOLDER_NAME }}
        run: |
          if [ -z "$SFTP_FOLDER_NAME" ]; then
            echo "Missing secret DREAMHOST_SFTP_FOLDER_NAME (e.g. football.spherearth.ca)"
            exit 1
          fi
          FOLDER="${SFTP_FOLDER_NAME#/}"
          FOLDER="${FOLDER%/}"
          REMOTE="/home/${SFTP_USERNAME}/${FOLDER}/"
          echo "Deploying to ${REMOTE}"
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" "sftp://$SFTP_SERVER" <<EOF
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no"
          mirror -R --delete --parallel=4 --verbose ./out/ $REMOTE
          quit
          EOF
